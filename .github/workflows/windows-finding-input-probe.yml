name: Windows finding input probe

on:
  push:
    branches: [ci/windows-oversized-input-2225]

permissions:
  contents: read
  actions: read

jobs:
  windows-input:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: 9d669d78c60b127fddcf259ff79f36522d460c86
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Set up TypeScript tools
        uses: ./.github/actions/setup-tools
      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"
      - name: Install dependencies
        shell: bash
        run: |
          pnpm --dir sdk/typescript install --frozen-lockfile
          pnpm --dir plugins/codex-security/mcp-app install --frozen-lockfile
      - name: Download unchanged bundled plugin
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          github-token: ${{ github.token }}
          run-id: 41791036829
          name: package-96d5f731591e69e26fb6379bc59bc7838e07c904
          path: dist
      - name: Restore plugin and build current SDK
        shell: bash
        run: |
          tar -xzf dist/*.tgz --strip-components=1 -C sdk/typescript package/_bundled_plugin
          mkdir -p plugins/codex-security/native/prebuilt sdk/typescript/reports
          cp -R sdk/typescript/_bundled_plugin/mcp/native/. plugins/codex-security/native/prebuilt
          pnpm --dir sdk/typescript run build
      - name: Prepare private Windows test root
        id: windows-temp
        shell: pwsh
        run: ./sdk/typescript/scripts/prepare-windows-test-root.ps1
      - name: Test Windows input workflows
        working-directory: sdk/typescript
        env:
          TEMP: ${{ steps.windows-temp.outputs.path }}
          TMP: ${{ steps.windows-temp.outputs.path }}
          TMPDIR: ${{ steps.windows-temp.outputs.path }}
          CODEX_SECURITY_TEST_TIMEOUT_MS: "120000"
          CODEX_SECURITY_ALLOW_MACHINE_POLICY_TEST: "false"
        run: >-
          bun test --timeout 120000
          --reporter=junit --reporter-outfile=reports/windows-input.xml
          ./tests-ts/cli-skill-windows-config.test.ts
          ./tests-ts/prompt-files-native.test.ts
          ./tests-ts/cli-large-input.test.ts
          ./tests-ts/skill-prompt.test.ts
          ./tests-ts/cli-large-input-native.test.ts
      - name: Upload test report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-finding-input-report
          path: sdk/typescript/reports/windows-input.xml
          if-no-files-found: ignore
          retention-days: 7
